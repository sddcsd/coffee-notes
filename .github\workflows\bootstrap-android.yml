name: Bootstrap Android project (RUN ONCE)

# ===========================================================================
# 一次性引导工作流
#
# 作用：生成 android/ 原生工程，并把「固定签名 + 版本号可控」的配置写好，
#       打包成产物供你下载、提交进仓库。
#
# 前置：仓库根目录需要有 android-build.gradle.template 这个文件
#       （已随本次交付提供）
#
# 用法：
#   1. 把本文件放到 .github/workflows/bootstrap-android.yml
#   2. 把 android-build.gradle.template 放到仓库根目录
#   3. push，或在 Actions 页手动触发本工作流
#   4. 跑完后下载产物 android-project
#   5. 解压，把 android/ 整个目录提交进仓库根目录
#   6. 把 .github/workflows/android.yml 换成正式版（android-fixed.yml）
#   7. 删除本文件和 template 文件
# ===========================================================================

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate android project
        run: npx cap add android

      - name: Apply fixed build.gradle
        run: python3 prepare_android.py

      - name: Show key config
        run: |
          echo "===== android/app/build.gradle ====="
          grep -nE "namespace|applicationId|versionCode|versionName|signingConfig|storeFile" android/app/build.gradle
          echo
          echo "===== strings.xml ====="
          cat android/app/src/main/res/values/strings.xml

      - name: Package android project
        run: |
          tar -czf android-project.tar.gz android
          ls -lh android-project.tar.gz

      - name: Upload android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android-project.tar.gz
          retention-days: 30
